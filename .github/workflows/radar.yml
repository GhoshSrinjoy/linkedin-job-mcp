name: Radar tests

on:
  push:
    branches: ["main"]
    paths: ["radar/**", ".github/workflows/radar.yml"]
  pull_request:
    branches: ["main"]
    paths: ["radar/**", ".github/workflows/radar.yml"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: radar/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
