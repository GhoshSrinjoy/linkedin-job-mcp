name: Windows app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:win
      - name: Check the app starts
        run: ./dist/linkedin-jobs-mcp.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: linkedin-jobs-mcp-windows
          path: |
            dist/linkedin-jobs-mcp.exe
            dist/linkedin-jobs-mcp.exe.sha256
      - name: Attach the app to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="dist/linkedin-jobs-mcp.exe dist/linkedin-jobs-mcp.exe.sha256"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" $files --clobber
